version: '3'
rpc:
    listen: 'tcp://127.0.0.1:6001'
server:
    command: 'php vendor/bin/roadrunner-worker'
    relay: pipes
http:
    address: '127.0.0.1:8001'
    middleware:
        - gzip
        - static
    static:
        dir: public
        forbid:
            - .php
            - .htaccess
    pool:
        num_workers: 1
        max_jobs: 500
        supervisor:
            exec_ttl: 30s
            max_worker_memory: 100
jobs:
    pool:
        num_workers: 2
        max_worker_memory: 100
    consume: {}
kv:
    local:
        driver: memory
        config:
            interval: 60
metrics:
    address: '127.0.0.1:2112'
