<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Amalgated Lending Inc.</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff9ed;
        color: #111827;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        padding: 16px;
      }
      .card {
        width: min(520px, 92vw);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #dc2626;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      button {
        margin-top: 20px;
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        background: #dc2626;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Connection issue</p>
      <h1>You appear to be offline</h1>
      <p>Please check your internet connection, then try again to continue using Amalgated Lending Inc.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
