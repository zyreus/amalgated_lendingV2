# Example: reverse-proxy chat/amalgatedlending.com subdomain to Node (port 8010).
# Duplicate Access-Control-Allow-Origin breaks admin CRM — do NOT repeat add_header ACAO here
# if Express (chat-server) already sends CORS. Pick one layer only.
#
# Typical listen/ssl/server_name lines omitted — paste `location /` blocks into your vhost.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream amalgated_chat_node {
    server 127.0.0.1:8010;
    keepalive 32;
}

server {
    # server_name chat.amalgatedlending.com;

    location / {
        proxy_pass http://amalgated_chat_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # If you formerly had:
    #   add_header Access-Control-Allow-Origin "https://amalgatedlending.com";
    # remove it — let Node cors() set ACAO alone.
}
